<svg xmlns="http://www.w3.org/2000/svg" width="880" height="238" viewBox="0 0 880 238" role="img" aria-label="terminal session">
  <rect x="1" y="1" width="878" height="236" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="878" height="34" rx="10" fill="#161b22"/>
  <rect x="1" y="18" width="878" height="17" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="440" y="23" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b949e">hrydarie@github: ~/hunt</text>

  <g font-family="monospace" font-size="16">
    <text x="24" y="66" fill="#c9d1d9" opacity="0">
      <tspan fill="#00ff41">$</tspan><tspan> whoami</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="92" fill="#8b949e" opacity="0">
      <tspan>hrydarie — security researcher, bug bounty hunter</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.10;0.96;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="126" fill="#c9d1d9" opacity="0">
      <tspan fill="#00ff41">$</tspan><tspan> ./map-surface --scope all</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.22;0.96;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="152" fill="#8b949e" opacity="0">
      <tspan>attack surface mapped — contracts, APIs, agent, client</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.34;0.96;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="186" fill="#c9d1d9" opacity="0">
      <tspan fill="#00ff41">$</tspan><tspan> ./validate --poc --runs 3</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.46;0.96;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="212" fill="#00ff41" opacity="0">
      <tspan>findings CONFIRMED — root cause traced, impact quantified</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.58;0.96;1" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="24" y="216" width="10" height="17" fill="#00ff41" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.66;0.96;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" begin="9.3s" repeatCount="4"/>
  </rect>
</svg>
